name: Daily Summary

on:
  schedule:
    - cron: "0 1 * * *"  # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        if: ${{ env.TWITTER_COOKIES != '' }}
        env:
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
        run: playwright install chromium

      - name: Restore Twitter cookies
        if: ${{ env.TWITTER_COOKIES != '' }}
        env:
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
        run: echo "$TWITTER_COOKIES" | base64 -d > twitter_cookies.json

      - name: Restore dedup state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: news-summary-state-${{ github.run_id }}
          restore-keys: news-summary-state

      - name: Create sources.yaml
        env:
          SOURCES_YAML: ${{ secrets.SOURCES_YAML }}
        run: echo "$SOURCES_YAML" | tr -d '\n' | base64 -d > sources.yaml

      - name: Run summary
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          OUTPUT_MODE: both
          NEWS_SUMMARY_STATE: ./state.json
        run: python -m src.runner

      - name: Commit summaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add -f summaries/
          git diff --cached --quiet || git commit -m "chore: daily summary $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      # ==============================
      # 生成网站
      # ==============================

      - name: Generate website
        run: |
          mkdir -p site

          python - <<'PY'
          from pathlib import Path
          import html
          import re

          summaries = Path("summaries")
          files = sorted(summaries.rglob("*.md"), reverse=True)

          items = []

          for file in files:
              date = file.stem
              content = file.read_text(encoding="utf-8")

              # 简单 Markdown → HTML
              content = html.escape(content)

              content = re.sub(
                  r'^### (.+)$',
                  r'<h3>\1</h3>',
                  content,
                  flags=re.MULTILINE
              )

              content = re.sub(
                  r'^## (.+)$',
                  r'<h2>\1</h2>',
                  content,
                  flags=re.MULTILINE
              )

              content = re.sub(
                  r'^# (.+)$',
                  r'<h1>\1</h1>',
                  content,
                  flags=re.MULTILINE
              )

              content = content.replace("\n", "<br>\n")

              items.append(f"""
              <article>
                <h2>{date}</h2>
                <div class="summary">
                  {content}
                </div>
              </article>
              """)

          page = f"""<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AI 每日新闻摘要</title>

            <style>
              body {{
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                             "Microsoft YaHei", Arial, sans-serif;
                max-width: 1000px;
                margin: 0 auto;
                padding: 30px 20px;
                background: #f5f7fa;
                color: #222;
                line-height: 1.7;
              }}

              header {{
                background: white;
                padding: 30px;
                border-radius: 12px;
                margin-bottom: 25px;
                box-shadow: 0 2px 10px rgba(0,0,0,.05);
              }}

              article {{
                background: white;
                padding: 30px;
                margin-bottom: 25px;
                border-radius: 12px;
                box-shadow: 0 2px 10px rgba(0,0,0,.05);
              }}

              h1 {{
                margin-top: 0;
              }}

              h2 {{
                border-bottom: 1px solid #eee;
                padding-bottom: 10px;
              }}

              h3 {{
                margin-top: 25px;
              }}

              .summary {{
                color: #444;
              }}

              footer {{
                text-align: center;
                color: #888;
                margin-top: 40px;
              }}
            </style>
          </head>

          <body>

            <header>
              <h1>AI 每日新闻摘要</h1>
              <p>自动抓取 AI、科技、创业与投资领域的重要信息</p>
              <p>每天北京时间 09:00 自动更新</p>
            </header>

            {''.join(items)}

            <footer>
              Automatically generated by GitHub Actions
            </footer>

          </body>
          </html>
          """

          Path("site/index.html").write_text(page, encoding="utf-8")
          PY

      # ==============================
      # GitHub Pages
      # ==============================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
